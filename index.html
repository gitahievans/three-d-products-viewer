<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Product Viewer</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loader"></div>
    <p>Loading 3D Models...</p>
  </div>

  <div class="container">
    <div class="header">
      <h1>3D Product Showcase</h1>
      <p>Interactive product viewer with material variations</p>
    </div>

    <div class="product-slider">
      <div class="slider-container" id="sliderContainer">
        <!-- Product cards will be generated by JavaScript -->
      </div>

      <!-- Navigation Dots -->
      <div class="slider-nav" id="sliderNav">
        <!-- Navigation dots will be generated by JavaScript -->
      </div>

      <!-- Arrow Navigation -->
      <div class="slider-arrows">
        <button class="arrow prev" id="prevBtn">‹</button>
        <button class="arrow next" id="nextBtn">›</button>
      </div>

      <!-- Touch Hint -->
      <div class="touch-hint">
        Drag to rotate • Scroll to zoom
      </div>
    </div>
  </div>

  <!-- Controls Panel (GUI will be attached here) -->
  <div class="controls-panel" id="controlsPanel"></div>

  <!-- Three.js and dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>

  <script src="./src/main.js" type="module"></script>


</body>

</html>
